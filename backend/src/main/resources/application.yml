# spring.application.name=evalhub
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/evaluation_platform
    username: admin
    password: password123
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  error:
    include-message: always

evalhub:
  mail:
    # 배포 전에는 발송하지 않는다. 암호화 키만 설정하면 생성 작업을 DB에 대기시킬 수 있다.
    enabled: ${EVALHUB_MAIL_ENABLED:false}
    client-id: ${EVALHUB_GMAIL_CLIENT_ID:}
    client-secret: ${EVALHUB_GMAIL_CLIENT_SECRET:}
    refresh-token: ${EVALHUB_GMAIL_REFRESH_TOKEN:}
    sender-email: ${EVALHUB_MAIL_SENDER:}
    login-url: ${EVALHUB_MAIL_LOGIN_URL:http://localhost:3000/login?role=evaluator}
    encryption-key: ${EVALHUB_MAIL_ENCRYPTION_KEY:}
    retention: ${EVALHUB_MAIL_RETENTION:7d}
    max-attempts: ${EVALHUB_MAIL_MAX_ATTEMPTS:5}
    poll-interval-ms: ${EVALHUB_MAIL_POLL_INTERVAL_MS:10000}
  bootstrap:
    admin-email: ${EVALHUB_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${EVALHUB_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    secure-cookie: ${EVALHUB_SECURE_COOKIE:false}
    # 운영 환경에서는 반드시 32바이트 이상의 임의 문자열로 교체한다.
    jwt-secret: ${EVALHUB_JWT_SECRET:evalhub-local-development-secret-change-me}
    access-token-minutes: ${EVALHUB_JWT_ACCESS_MINUTES:30}
    remembered-token-days: ${EVALHUB_JWT_REMEMBERED_DAYS:30}
  storage:
    attachments-path: uploads/attachments

springdoc:
  packages-to-scan: com.example.evalhub.controller
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
